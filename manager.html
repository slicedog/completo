<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slice Dog | Dashboard Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: 'Inter', sans-serif; }
        .card { background: #111; border: 1px solid rgba(255,255,255,0.05); border-radius: 1.5rem; }
        .input-nexus { background: #1a1a1a; border: 1px solid #333; color: white; }
        .input-nexus:focus { border-color: #e52320; outline: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-3xl font-black italic uppercase tracking-tighter">Slice Dog Club</h1>
                <p class="text-gray-500 text-xs font-bold uppercase tracking-widest">Dashboard de Gestión</p>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="exportarClientesExcel()" class="flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black italic uppercase tracking-wider px-4 py-3 rounded-xl transition-all">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Exportar Excel</span>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="card p-6 flex items-center space-x-4">
                <div class="p-4 bg-orange-500/10 rounded-2xl"><i data-lucide="users" class="text-orange-500"></i></div>
                <div>
                    <p class="text-gray-500 text-[10px] font-black uppercase">Clientes Totales</p>
                    <h3 id="stat-clientes" class="text-2xl font-black italic">--</h3>
                </div>
            </div>
            <div class="card p-6 flex items-center space-x-4">
                <div class="p-4 bg-red-500/10 rounded-2xl"><i data-lucide="target" class="text-red-500"></i></div>
                <div>
                    <p class="text-gray-500 text-[10px] font-black uppercase">Sistema</p>
                    <h3 class="text-xl font-black italic text-red-500">ACTIVO</h3>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="card p-6 border-red-500/20">
                    <h2 class="text-sm font-black italic uppercase mb-6 flex items-center text-red-500">
                        <i data-lucide="megaphone" class="w-4 h-4 mr-2"></i> Push Notifications
                    </h2>
                    <p class="text-[10px] text-gray-500 mb-4">Requiere configuración de Cloud Functions (Back-end).</p>
                    <div class="space-y-4 opacity-50 cursor-not-allowed">
                        <input type="text" placeholder="Título" class="w-full p-4 rounded-xl input-nexus font-bold text-sm" disabled>
                        <textarea rows="2" placeholder="Mensaje..." class="w-full p-4 rounded-xl input-nexus font-bold text-sm" disabled></textarea>
                        <button class="w-full py-4 bg-gray-800 text-gray-400 font-black rounded-xl">Configuración Pendiente</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="card p-6 min-h-[400px]">
                    <h2 class="text-sm font-black italic uppercase mb-6 flex items-center">
                        <i data-lucide="award" class="w-4 h-4 mr-2"></i> Ranking de Clientes
                    </h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="text-gray-500 text-[10px] font-black uppercase border-b border-white/5">
                                    <th class="pb-4 px-2">Nombre</th>
                                    <th class="pb-4 px-2 text-center">Sellos</th>
                                    <th class="pb-4 px-2 text-right">WhatsApp</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-clientes" class="divide-y divide-white/5">
                                <tr><td colspan="3" class="py-4 text-center text-gray-500">Cargando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAjIQZNTArSvmCEXPKYDjhZsUo0EqT49xE",
            authDomain: "sdog-9a2f3.firebaseapp.com",
            projectId: "sdog-9a2f3",
            storageBucket: "sdog-9a2f3.firebasestorage.app",
            messagingSenderId: "55857543773",
            appId: "1:55857543773:web:af9a4e4a009eba99d8ebb4"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Cargar clientes
        const q = query(collection(db, "users"), orderBy("stamps", "desc"));
        onSnapshot(q, (snap) => {
            const tbody = document.getElementById('tabla-clientes');
            tbody.innerHTML = "";
            document.getElementById('stat-clientes').innerText = snap.size;
            
            snap.forEach(u => {
                const user = u.data();
                tbody.innerHTML += `
                    <tr class="text-sm font-medium">
                        <td class="py-4 px-2 uppercase font-black italic">${user.name || 'Sin nombre'}</td>
                        <td class="py-4 px-2 text-center">
                            <span class="bg-red-500/20 text-red-500 px-3 py-1 rounded-full text-xs font-black">${user.stamps || 0}</span>
                        </td>
                        <td class="py-4 px-2 text-right text-gray-500 text-xs">${user.whatsapp || '-'}</td>
                    </tr>
                `;
            });
        });

        // Exportar a Excel
        window.exportarClientesExcel = async () => {
            try {
                const snapshot = await getDocs(collection(db, "users"));
                const filas = snapshot.docs.map(doc => {
                    const u = doc.data();
                    return { "Nombre": u.name || "N/A", "Sellos": u.stamps || 0, "WhatsApp": u.whatsapp || "-", "Email": u.email || "-" };
                });
                const worksheet = XLSX.utils.json_to_sheet(filas);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Clientes");
                XLSX.writeFile(workbook, `SliceDog_Clientes.xlsx`);
            } catch (error) { alert("Error al exportar."); }
        };

        lucide.createIcons();
    </script>
</body>
</html>
