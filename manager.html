<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Dueño | Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: 'Inter', sans-serif; }
        .card { background: #111; border: 1px solid rgba(255,255,255,0.05); border-radius: 1.5rem; }
        .input-nexus { background: #1a1a1a; border: 1px solid #333; color: white; }
        .input-nexus:focus { border-color: #e88d14; outline: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-3xl font-black italic uppercase tracking-tighter">Panel de Control</h1>
                <p class="text-gray-500 text-xs font-bold uppercase tracking-widest">Gestión de Lealtad Nexus</p>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="exportarClientesExcel()" class="flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black italic uppercase tracking-wider px-4 py-3 rounded-xl transition-all shadow-lg shadow-emerald-900/10">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Exportar Excel</span>
                </button>
                <button onclick="location.reload()" class="p-3 card hover:bg-white/5 transition-all">
                    <i data-lucide="refresh-cw" class="w-5 h-5 text-orange-500"></i>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="card p-6 flex items-center space-x-4">
                <div class="p-4 bg-orange-500/10 rounded-2xl"><i data-lucide="users" class="text-orange-500"></i></div>
                <div>
                    <p class="text-gray-500 text-[10px] font-black uppercase">Clientes Totales</p>
                    <h3 id="stat-clientes" class="text-2xl font-black italic">--</h3>
                </div>
            </div>
            <div class="card p-6 flex items-center space-x-4">
                <div class="p-4 bg-green-500/10 rounded-2xl"><i data-lucide="target" class="text-green-500"></i></div>
                <div>
                    <p class="text-gray-500 text-[10px] font-black uppercase">Meta Actual</p>
                    <h3 id="stat-meta" class="text-2xl font-black italic">--</h3>
                </div>
            </div>
            <div class="card p-6 flex items-center space-x-4">
                <div class="p-4 bg-blue-500/10 rounded-2xl"><i data-lucide="shield-check" class="text-blue-400"></i></div>
                <div>
                    <p class="text-gray-500 text-[10px] font-black uppercase">PIN de Acceso</p>
                    <h3 id="stat-pin" class="text-2xl font-black italic">--</h3>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="card p-6">
                    <h2 class="text-sm font-black italic uppercase mb-6 flex items-center">
                        <i data-lucide="settings" class="w-4 h-4 mr-2"></i> Ajustes del Programa
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-black text-gray-500 uppercase ml-2">Meta de Sellos</label>
                            <input type="number" id="input-meta" class="w-full p-4 rounded-xl input-nexus mt-1 font-bold">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-500 uppercase ml-2">PIN del Staff</label>
                            <input type="text" id="input-pin" class="w-full p-4 rounded-xl input-nexus mt-1 font-bold">
                        </div>
                        <button onclick="guardarAjustes()" class="w-full py-4 bg-white text-black font-black italic uppercase rounded-xl hover:bg-orange-500 hover:text-white transition-all">Actualizar</button>
                    </div>
                </div>

                <div class="card p-6 border-emerald-500/20">
                    <h2 class="text-sm font-black italic uppercase mb-6 flex items-center text-emerald-400">
                        <i data-lucide="megaphone" class="w-4 h-4 mr-2"></i> Envío Masivo (Push)
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-black text-gray-500 uppercase ml-2">Título del Mensaje</label>
                            <input type="text" id="push-titulo" placeholder="Ej: ¡Promo 2x1! 🍕" class="w-full p-4 rounded-xl input-nexus mt-1 font-bold text-sm">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-500 uppercase ml-2">Contenido</label>
                            <textarea id="push-mensaje" rows="2" placeholder="Solo por hoy, ven a probar..." class="w-full p-4 rounded-xl input-nexus mt-1 font-bold text-sm resize-none"></textarea>
                        </div>
                        <button onclick="enviarPushMasivo()" id="btn-push" class="w-full py-4 bg-emerald-600 text-white font-black italic uppercase rounded-xl hover:bg-emerald-500 transition-all shadow-lg shadow-emerald-900/20 flex justify-center items-center gap-2">
                            <i data-lucide="send" class="w-4 h-4"></i> Enviar a Todos
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="card p-6 min-h-[400px]">
                    <h2 class="text-sm font-black italic uppercase mb-6 flex items-center">
                        <i data-lucide="award" class="w-4 h-4 mr-2"></i> Ranking de Lealtad
                    </h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="text-gray-500 text-[10px] font-black uppercase border-b border-white/5">
                                    <th class="pb-4 px-2">Cliente</th>
                                    <th class="pb-4 px-2 text-center">Sellos</th>
                                    <th class="pb-4 px-2 text-right">WhatsApp</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-clientes" class="divide-y divide-white/5">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc, collection, query, orderBy, limit, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyAjIQZNTArSvmCEXPKYDjhZsUo0EqT49xE",
  authDomain: "sdog-9a2f3.firebaseapp.com",
  projectId: "sdog-9a2f3",
  storageBucket: "sdog-9a2f3.firebasestorage.app",
  messagingSenderId: "55857543773",
  appId: "1:55857543773:web:af9a4e4a009eba99d8ebb4"
};
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const COMERCIO_ID = new URLSearchParams(window.location.search).get('id');

        if (!COMERCIO_ID) {
            alert("Falta el parámetro '?id=' en la URL. Ej: manager.html?id=completo");
        }

        // 1. Escuchar Ajustes
        onSnapshot(doc(db, "comercios", COMERCIO_ID, "config", "ajustes"), (snap) => {
            if (snap.exists()) {
                const data = snap.data();
                document.getElementById('stat-meta').innerText = data.meta || 10;
                document.getElementById('stat-pin').innerText = data.pin || "****";
                document.getElementById('input-meta').value = data.meta || 10;
                document.getElementById('input-pin').value = data.pin || "";
            }
        });

        // 2. Escuchar Usuarios
        const q = query(collection(db, "comercios", COMERCIO_ID, "usuarios"), orderBy("sellos", "desc"), limit(20));
        onSnapshot(q, (snap) => {
            const tbody = document.getElementById('tabla-clientes');
            tbody.innerHTML = "";
            document.getElementById('stat-clientes').innerText = snap.size;
            snap.forEach(u => {
                const user = u.data();
                tbody.innerHTML += `
                    <tr class="text-sm font-medium">
                        <td class="py-4 px-2 uppercase font-black italic">${user.nombre || 'Sin nombre'}</td>
                        <td class="py-4 px-2 text-center">
                            <span class="bg-orange-500/20 text-orange-500 px-3 py-1 rounded-full text-xs font-black">${user.sellos || 0}</span>
                        </td>
                        <td class="py-4 px-2 text-right text-gray-500 text-xs">${user.whatsapp || '-'}</td>
                    </tr>
                `;
            });
        });

        // 3. Guardar Ajustes
        window.guardarAjustes = async () => {
            const nuevaMeta = document.getElementById('input-meta').value;
            const nuevoPin = document.getElementById('input-pin').value;
            try {
                await updateDoc(doc(db, "comercios", COMERCIO_ID, "config", "ajustes"), {
                    meta: Number(nuevaMeta),
                    pin: nuevoPin
                });
                alert("¡Ajustes guardados!");
            } catch (error) {
                console.error("Error:", error);
                alert("Error al actualizar.");
            }
        };

        // 4. ENVÍO PUSH (CON DEBUGGER)
        window.enviarPushMasivo = async () => {
            const titulo = document.getElementById('push-titulo').value;
            const mensaje = document.getElementById('push-mensaje').value;
            const btn = document.getElementById('btn-push');

            if (!titulo || !mensaje) {
                alert("Completa el título y el contenido.");
                return;
            }

            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            try {
                console.log("Iniciando envío de push...");
                const response = await fetch("https://us-central1-beehive-app-66f10.cloudfunctions.net/enviarPushMasivo", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        comercioId: COMERCIO_ID,
                        titulo: titulo,
                        mensaje: mensaje
                    })
                });

                const text = await response.text(); // Leemos como texto primero para ver qué llega
                console.log("Respuesta del servidor (Status " + response.status + "):", text);

                if (response.ok) {
                    alert("¡Éxito! Notificación enviada.");
                } else {
                    alert("Error en servidor. Mira la consola (F12).");
                }
            } catch (error) {
                console.error("ERROR CRÍTICO:", error);
                alert("Error de conexión. Revisa la consola (F12).");
            } finally {
                btn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> Enviar a Todos`;
                btn.disabled = false;
                lucide.createIcons();
            }
        };

        window.exportarClientesExcel = async () => {
            try {
                const snapshot = await getDocs(collection(db, "comercios", COMERCIO_ID, "usuarios"));
                const filas = [];
                snapshot.forEach(doc => {
                    const u = doc.data();
                    filas.push({ "Nombre": u.nombre || "Sin nombre", "Sellos": u.sellos || 0, "WhatsApp": u.whatsapp || "-" });
                });
                const worksheet = XLSX.utils.json_to_sheet(filas);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Clientes");
                XLSX.writeFile(workbook, `Clientes_Nexus_${COMERCIO_ID}.xlsx`);
            } catch (error) {
                alert("Error al exportar.");
            }
        };

        lucide.createIcons();
    </script>
</body>
</html>
