<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌭 Validator | Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAjIQZNTArSvmCEXPKYDjhZsUo0EqT49xE",
            authDomain: "sdog-9a2f3.firebaseapp.com",
            projectId: "sdog-9a2f3",
            storageBucket: "sdog-9a2f3.firebasestorage.app",
            messagingSenderId: "55857543773",
            appId: "1:55857543773:web:af9a4e4a009eba99d8ebb4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.buscarPin = async () => {
            const pinBuscado = parseInt(document.getElementById('search-pin').value);
            const infoDiv = document.getElementById('info-cliente');
            if(!pinBuscado) return;

            infoDiv.innerHTML = `<p class="text-white animate-pulse text-center">Buscando PIN ${pinBuscado}...</p>`;
            const q = query(collection(db, "users"), where("active_pin", "==", pinBuscado));
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                const userDoc = querySnapshot.docs[0];
                const data = userDoc.data();
                const currentStamps = data.stamps || 0;
                
                // Forzamos un fallback por si pin_type no viene definido desde el index
                const tipoPin = data.pin_type || 'SELLO'; 

                const isNinth = (currentStamps === 9);
                const isTenth = (currentStamps >= 10);

                // Configuración visual dinámica para el cajero basado en los sellos del cliente
                let banner = '';
                let borderClass = 'border-green-500';
                let bgClass = 'bg-blue-50';
                let btnColor = 'bg-green-600';
                let btnText = 'Confirmar Sello';

                if (isNinth) {
                    banner = '<div class="bg-blue-600 text-white text-center p-2 rounded-lg font-black text-xs mb-3 animate-bounce">¡ATENCIÓN: PRÓXIMO SELLO COMPLETA TARJETA (10/10)!</div>';
                    borderClass = 'border-blue-500';
                    bgClass = 'bg-blue-50';
                    btnColor = 'bg-blue-600';
                    btnText = 'SUMAR SELLO Nº 10';
                } else if (isTenth) {
                    banner = '<div class="bg-orange-600 text-white text-center p-2 rounded-lg font-black text-xs mb-3 animate-bounce">¡PREMIO EN COLA: ENTREGAR HOT DOG / PIZZA GRATIS!</div>';
                    borderClass = 'border-orange-500';
                    bgClass = 'bg-orange-50';
                    btnColor = 'bg-orange-600';
                    btnText = 'VALIDAR PREMIO Y REINICIAR TARJETA';
                }

                infoDiv.innerHTML = `
                    <div class="p-6 rounded-[2rem] shadow-2xl border-4 ${borderClass} ${bgClass} transition-all">
                        ${banner}
                        <h2 class="text-2xl font-black text-neutral-800">${data.name || 'Cliente'}</h2>
                        <p class="text-xs text-gray-500 mb-4">${userDoc.id}</p>
                        <div class="bg-neutral-100 p-4 rounded-2xl mb-4 flex justify-between items-center">
                            <div><p class="text-[10px] font-bold text-neutral-400">TIPO ACCIÓN</p><p class="font-black text-neutral-700">${tipoPin}</p></div>
                            <div class="text-right"><p class="text-[10px] font-bold text-neutral-400">SELLOS ACTUALES</p><p class="text-xl font-black">${currentStamps}/10</p></div>
                        </div>
                        <button onclick="confirmarEntrega('${userDoc.id}', '${tipoPin}', ${currentStamps})" class="w-full py-5 ${btnColor} text-white rounded-2xl font-black uppercase shadow-lg active:scale-95 transition-transform">${btnText}</button>
                    </div>`;
            } else {
                infoDiv.innerHTML = `<div class="bg-red-500/20 border-2 border-red-500 p-4 rounded-2xl text-center text-red-500 font-black">PIN INVÁLIDO O EXPIRADO</div>`;
            }
        };

        window.confirmarEntrega = async (email, tipo, stamps) => {
            if(confirm('¿Procesar esta solicitud en la base de datos?')){
                const userRef = doc(db, "users", email);
                let updates = { active_pin: deleteField(), pin_timestamp: deleteField(), pin_type: deleteField(), lastUpdate: new Date() };
                
                const tipoReal = tipo || 'SELLO';

                if(tipoReal === 'SELLO') {
                    // NUEVA LÓGICA CORREGIDA:
                    if (stamps >= 10) {
                        updates.stamps = 0; // Si ya tiene 10, el PIN actual limpia la tarjeta a 0
                    } else {
                        updates.stamps = stamps + 1; // Si tiene 9, ahora SÍ sube a 10 perfectamente
                    }
                } else if(tipoReal === 'TABLERO') {
                    updates.stamps = 0;
                }

                await updateDoc(userRef, updates);
                alert("¡Base de datos actualizada con éxito!");
                location.reload();
            }
        };
    </script>
</head>
<body class="bg-neutral-900 p-6 flex flex-col items-center min-h-screen font-sans">
    <div class="w-full max-w-sm text-center mb-8">
        <h1 class="text-white font-black text-3xl italic uppercase">SD <span class="text-orange-500">Validator</span></h1>
    </div>
    <div class="w-full max-w-sm mb-8">
        <input type="number" id="search-pin" placeholder="PIN de 4 dígitos" class="w-full p-6 rounded-2xl mb-4 font-black text-4xl text-center outline-none">
        <button onclick="buscarPin()" class="w-full py-5 bg-orange-500 text-white rounded-2xl font-black uppercase text-lg">Verificar PIN</button>
    </div>
    <div id="info-cliente" class="w-full max-w-sm"></div>
</body>
</html>
