<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌭 Validator | Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #2c3e50; }
        .bg-sd-red { background-color: #e52320; }
        .text-sd-red { color: #e52320; }
        .border-sd-red { border-color: #e52320; }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAjIQZNTArSvmCEXPKYDjhZsUo0EqT49xE",
            authDomain: "sdog-9a2f3.firebaseapp.com",
            projectId: "sdog-9a2f3",
            storageBucket: "sdog-9a2f3.firebasestorage.app",
            messagingSenderId: "55857543773",
            appId: "1:55857543773:web:af9a4e4a009eba99d8ebb4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.buscarPin = async () => {
            const pinBuscado = parseInt(document.getElementById('search-pin').value);
            const infoDiv = document.getElementById('info-cliente');
            if(!pinBuscado) return;

            infoDiv.innerHTML = `<p class="text-white animate-pulse text-center">Buscando...</p>`;
            const q = query(collection(db, "users"), where("active_pin", "==", pinBuscado));
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                const userDoc = querySnapshot.docs[0];
                const data = userDoc.data();
                const currentStamps = data.stamps || 0;
                const tipoPin = data.pin_type || 'SELLO'; 

                const isNinth = (currentStamps === 9);
                const isTenth = (currentStamps >= 10);

                let banner = '';
                let borderClass = 'border-white';
                let btnColor = 'bg-sd-red';
                let btnText = 'CONFIRMAR SELLO';

                if (isNinth) {
                    banner = '<div class="bg-white text-sd-red text-center p-2 rounded-lg font-black text-xs mb-3 animate-bounce">¡PRÓXIMO SELLO COMPLETA LA TARJETA!</div>';
                    btnText = 'SUMAR SELLO Nº 10';
                } else if (isTenth) {
                    banner = '<div class="bg-sd-red text-white text-center p-2 rounded-lg font-black text-xs mb-3 animate-bounce">¡PREMIO LISTO PARA CANJEAR!</div>';
                    btnText = 'VALIDAR Y REINICIAR';
                }

                infoDiv.innerHTML = `
                    <div class="bg-white p-6 rounded-[2rem] shadow-2xl border-4 ${borderClass}">
                        ${banner}
                        <h2 class="text-2xl font-black text-neutral-800">${data.name || 'Cliente'}</h2>
                        <div class="bg-neutral-100 p-4 rounded-2xl my-4 flex justify-between items-center">
                            <div><p class="text-[10px] font-bold text-neutral-400">ESTADO</p><p class="font-black">${tipoPin}</p></div>
                            <div class="text-right"><p class="text-[10px] font-bold text-neutral-400">SELLOS</p><p class="text-xl font-black">${currentStamps}/10</p></div>
                        </div>
                        <button onclick="confirmarEntrega('${userDoc.id}', '${tipoPin}', ${currentStamps})" class="w-full py-5 ${btnColor} text-white rounded-2xl font-black uppercase shadow-lg">${btnText}</button>
                    </div>`;
            } else {
                infoDiv.innerHTML = `<div class="bg-red-600 text-white p-4 rounded-2xl text-center font-black">PIN NO VÁLIDO</div>`;
            }
        };

        window.confirmarEntrega = async (email, tipo, stamps) => {
            if(confirm('¿Procesar esta solicitud?')){
                const userRef = doc(db, "users", email);
                let updates = { active_pin: deleteField(), pin_timestamp: deleteField(), pin_type: deleteField(), lastUpdate: new Date() };
                if((tipo || 'SELLO') === 'SELLO') {
                    updates.stamps = (stamps >= 10) ? 0 : stamps + 1;
                } else {
                    updates.stamps = 0;
                }
                await updateDoc(userRef, updates);
                location.reload();
            }
        };
    </script>
</head>
<body class="p-6 flex flex-col items-center min-h-screen font-sans">
    <div class="w-full max-w-sm text-center mb-8">
        <h1 class="text-white font-black text-3xl italic uppercase">SD <span class="text-sd-red">VALIDATOR</span></h1>
    </div>
    <div class="w-full max-w-sm mb-8">
        <input type="number" id="search-pin" placeholder="PIN" class="w-full p-6 rounded-2xl mb-4 font-black text-4xl text-center outline-none shadow-xl">
        <button onclick="buscarPin()" class="w-full py-5 bg-sd-red text-white rounded-2xl font-black uppercase text-lg shadow-lg">Verificar PIN</button>
    </div>
    <div id="info-cliente" class="w-full max-w-sm"></div>
</body>
</html>
